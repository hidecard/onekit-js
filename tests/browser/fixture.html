<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>OneKit browser smoke</title></head>
  <body><section id="app"><button id="counter">0</button><h1 id="title">Projected</h1><label for="controlled">Name</label><input id="controlled" value="server"><output id="controlled-output">server</output><ul id="keyed-list"><li data-key="a"><button data-item="a">A:0</button></li><li data-key="b"><button data-item="b">B:0</button></li><li data-key="c"><button data-item="c">C:0</button></li></ul></section>
    <script type="module">
      import { h, hydrate, patch } from '/dist/onekit.esm.js';

      const root = document.querySelector('#app');
      const button = document.querySelector('#counter');
      const title = document.querySelector('#title');
      const input = document.querySelector('#controlled');
      const output = document.querySelector('#controlled-output');
      const keyedList = document.querySelector('#keyed-list');
      const itemCounts = { a: 0, b: 0, c: 0 };
      let keyedOrder = ['a', 'b', 'c'];
      const events = [];
      const callbackRef = element => events.push(element ? 'set' : 'clear');
      const objectRef = { current: null };
      let count = 0;
      const keyedChildren = () => h('ul', { id: 'keyed-list' }, ...keyedOrder.map(key => h('li', { key, 'data-key': key },
        h('button', {
          'data-item': key,
          onClick: () => {
            itemCounts[key] += 1;
            const current = document.querySelector(`[data-item="${key}"]`);
            if (current) current.textContent = `${key.toUpperCase()}:${itemCounts[key]}`;
          },
        }, `${key.toUpperCase()}:${itemCounts[key]}`),
      )));

      const makeVNode = () => h('section', {},
        h('button', {
          id: 'counter',
          ref: callbackRef,
          onClick: () => {
            count += 1;
            button.textContent = String(count);
          },
        }, '0'),
        h('h1', { ref: objectRef }, 'Projected'),
        h('label', { for: 'controlled' }, 'Name'),
        h('input', {
          id: 'controlled',
          value: 'server',
          onInput: event => {
            const value = event.currentTarget.value;
            input.value = value;
            output.textContent = value;
          },
        }),
        h('output', { id: 'controlled-output' }, 'server'),
        keyedChildren(),
      );

      let vnode = makeVNode();

      const buildBenchmarkList = (order) => h('ul', { className: 'benchmark-list' }, ...order.map(key => h('li', { key, 'data-key': String(key) }, `Item ${key}`)));
      const runKeyedBenchmark = (size = 500, rounds = 5) => {
        const host = document.createElement('div');
        document.body.appendChild(host);
        let order = Array.from({ length: size }, (_, index) => index);
        let previous = buildBenchmarkList(order);
        patch(host, previous);
        const start = performance.now();
        for (let round = 0; round < rounds; round += 1) {
          order = round % 2 === 0 ? order.slice().reverse() : order.slice(1).concat(order[0]);
          const next = buildBenchmarkList(order);
          patch(host, next, previous);
          previous = next;
        }
        const durationMs = performance.now() - start;
        const result = { size, rounds, durationMs, nodeCount: host.firstElementChild?.children.length || 0 };
        host.remove();
        return result;
      };
      const runDomHeavyBenchmark = (size = 300, rounds = 4) => {
        const host = document.createElement('div');
        document.body.appendChild(host);
        let order = Array.from({ length: size }, (_, index) => index);
        const buildTree = values => h('main', { className: 'benchmark-tree' }, ...values.map(key => h('article', { key },
          h('h2', {}, `Card ${key}`),
          h('p', {}, `Content for card ${key}`),
          h('span', {}, `Value ${key}`),
        )));
        let previous = buildTree(order);
        patch(host, previous);
        const start = performance.now();
        for (let round = 0; round < rounds; round += 1) {
          order = order.slice().reverse();
          const next = buildTree(order);
          patch(host, next, previous);
          previous = next;
        }
        const durationMs = performance.now() - start;
        const result = { size, rounds, durationMs, nodeCount: host.querySelectorAll('article').length };
        host.remove();
        return result;
      };

      const buildSsrListMarkup = size => `<main data-ssr-list="true">${Array.from({ length: size }, (_, index) => `<article data-ssr-key="${index}"><h2>Server ${index}</h2><p>Hydrated content ${index}</p></article>`).join('')}</main>`;
      const buildSsrListVNode = size => h('main', { 'data-ssr-list': 'true' }, ...Array.from({ length: size }, (_, index) => h('article', { key: index, 'data-ssr-key': String(index) }, h('h2', {}, `Server ${index}`), h('p', {}, `Hydrated content ${index}`))));
      const runSsrHydrationBenchmark = (size = 400, rounds = 1) => {
        const host = document.createElement('div');
        host.innerHTML = buildSsrListMarkup(size);
        document.body.appendChild(host);
        const target = host.firstElementChild;
        const vnode = buildSsrListVNode(size);
        const start = performance.now();
        let hydration;
        for (let round = 0; round < rounds; round += 1) hydration = hydrate(target, vnode);
        const durationMs = performance.now() - start;
        const result = { size, rounds, durationMs, nodeCount: host.querySelectorAll('[data-ssr-key]').length, mismatches: hydration?.mismatches?.length || 0 };
        hydration?.dispose();
        host.remove();
        return result;
      };
      const buildSlotTreeMarkup = groups => `<main data-slot-tree="true">${Array.from({ length: groups }, (_, group) => `<article data-slot-group="${group}"><header slot="header" data-slot="header">Header ${group}</header><div slot="body" data-slot="body"><span>Body ${group} A</span><span>Body ${group} B</span></div><footer slot="footer" data-slot="footer">Footer ${group}</footer></article>`).join('')}</main>`;
      const buildSlotTreeVNode = groups => h('main', { 'data-slot-tree': 'true' }, ...Array.from({ length: groups }, (_, group) => h('article', { key: group, 'data-slot-group': String(group) }, h('header', { slot: 'header', 'data-slot': 'header' }, `Header ${group}`), h('div', { slot: 'body', 'data-slot': 'body' }, h('span', {}, `Body ${group} A`), h('span', {}, `Body ${group} B`)), h('footer', { slot: 'footer', 'data-slot': 'footer' }, `Footer ${group}`))));
      const runSlotHeavyBenchmark = (groups = 120, rounds = 1) => {
        const host = document.createElement('div');
        host.innerHTML = buildSlotTreeMarkup(groups);
        document.body.appendChild(host);
        const target = host.firstElementChild;
        const vnode = buildSlotTreeVNode(groups);
        const start = performance.now();
        let hydration;
        for (let round = 0; round < rounds; round += 1) hydration = hydrate(target, vnode);
        const durationMs = performance.now() - start;
        const result = { groups, rounds, durationMs, groupCount: host.querySelectorAll('[data-slot-group]').length, slotNodeCount: host.querySelectorAll('[data-slot]').length, mismatches: hydration?.mismatches?.length || 0 };
        hydration?.dispose();
        host.remove();
        return result;
      };
      const buildSlotUpdateVNode = (groups, variant = 0, order = null) => {
        const keys = order || Array.from({ length: groups }, (_, index) => index);
        return h('main', { 'data-slot-tree': 'true' }, ...keys.map(group => h('article', { key: group, 'data-slot-group': String(group) },
          h('header', { slot: 'header', 'data-slot': 'header' }, `Header ${group} v${variant}`),
          h('div', { slot: 'body', 'data-slot': 'body' }, h('span', {}, `Body ${group} A v${variant}`), h('span', {}, `Body ${group} B v${variant}`)),
          h('footer', { slot: 'footer', 'data-slot': 'footer' }, `Footer ${group} v${variant}`),
        )));
      };
      const runSlotUpdateBenchmark = (groups = 120, rounds = 4) => {
        const host = document.createElement('div');
        document.body.appendChild(host);
        let previous = buildSlotUpdateVNode(groups, 0);
        patch(host, previous);
        const start = performance.now();
        for (let round = 1; round <= rounds; round += 1) {
          const next = buildSlotUpdateVNode(groups, round);
          patch(host, next, previous);
          previous = next;
        }
        const durationMs = performance.now() - start;
        const result = { groups, rounds, durationMs, groupCount: host.querySelectorAll('[data-slot-group]').length, slotNodeCount: host.querySelectorAll('[data-slot]').length, updated: host.querySelector('[data-slot="header"]')?.textContent?.endsWith(`v${rounds}`) || false };
        host.remove();
        return result;
      };
      const runSlotReorderBenchmark = (groups = 120, rounds = 4) => {
        const host = document.createElement('div');
        document.body.appendChild(host);
        let order = Array.from({ length: groups }, (_, index) => index);
        let previous = buildSlotUpdateVNode(groups, 0, order);
        patch(host, previous);
        const initialNodes = new Map(Array.from(host.querySelectorAll('[data-slot-group]')).map(node => [node.dataset.slotGroup, node]));
        const start = performance.now();
        for (let round = 0; round < rounds; round += 1) {
          order = round % 2 === 0 ? order.slice().reverse() : order.slice(1).concat(order[0]);
          const next = buildSlotUpdateVNode(groups, round + 1, order);
          patch(host, next, previous);
          previous = next;
        }
        const durationMs = performance.now() - start;
        const nodes = Array.from(host.querySelectorAll('[data-slot-group]'));
        const identityPreserved = nodes.every(node => initialNodes.get(node.dataset.slotGroup) === node);
        const result = { groups, rounds, durationMs, groupCount: nodes.length, firstKey: nodes[0]?.dataset.slotGroup || null, identityPreserved };
        host.remove();
        return result;
      };

      const hydration = hydrate(root, vnode);
      window.OneKitBrowserSmoke = {
        root,
        button,
        title,
        objectRef,
        events,
        hydration,
        click() { button.click(); },
        setControlled(value) {
          input.value = value;
          input.dispatchEvent(new Event('input', { bubbles: true }));
        },
        reorder(order) {
          keyedOrder = order.slice();
          const next = makeVNode();
          patch(root.parentElement, next, vnode);
          vnode = next;
        },
        runKeyedBenchmark,
        runDomHeavyBenchmark,
        runSsrHydrationBenchmark,
        runSlotHeavyBenchmark,
        runSlotUpdateBenchmark,
        runSlotReorderBenchmark,
        keyedSnapshot() {
          return Array.from(keyedList.children).map(item => ({
            key: item.dataset.key,
            nodeId: item.__oneKitNodeId || null,
            text: item.textContent,
          }));
        },
        markKeyedNodes() {
          Array.from(keyedList.children).forEach((item, index) => { item.__oneKitNodeId = item.__oneKitNodeId || `node-${index}-${item.dataset.key}`; });
        },
        clickKey(key) { document.querySelector(`[data-item="${key}"]`).click(); },
        dispose() { hydration.dispose(); },
        snapshot() {
          return {
            text: button.textContent,
            title: title.textContent,
            input: input.value,
            output: output.textContent,
            mismatches: hydration.mismatches,
            callbackRef: events.slice(),
            objectRef: objectRef.current?.id || null,
            rootVNode: Boolean(root._vnode),
          };
        },
      };
    </script>
  </body>
</html>
