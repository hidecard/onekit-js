<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OneKit V3 Counter</title>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">OneKit JS V3</p>
      <h1>Reactive Counter</h1>
      <p id="value" class="value">0</p>
      <div class="actions">
        <button id="decrement">−</button>
        <button id="increment">+</button>
      </div>
      <p class="hint">This example uses <code>reactive()</code> and <code>effect()</code>.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
