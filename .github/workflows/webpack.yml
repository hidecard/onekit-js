name: OneKit V3 CI

on:
  push:
    branches: [V3]
    tags: ['v*']
  pull_request:
    branches: [V3]

permissions:
  contents: read

concurrency:
  group: onekit-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Test with coverage
        run: npm test -- --runInBand --coverage

      - name: Build library
        run: npm run build

      - name: Build documentation
        run: npm run docs:build

      - name: Production dependency audit
        run: npm audit --omit=dev

  package:
    name: Verify packed package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify clean package installation
        run: npm run verify:package

      - name: Inspect package contents
        run: npm pack --dry-run

  release-artifact:
    name: Build release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Pack release tarball
        run: npm pack --pack-destination ./release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: onekit-v3-release
          path: release/*.tgz
          if-no-files-found: error
