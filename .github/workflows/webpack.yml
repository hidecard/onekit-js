name: OneKit V3 CI

on:
  push:
    branches: [V3]
    tags: ['v*']
  pull_request:
    branches: [V3]

permissions:
  contents: read

concurrency:
  group: onekit-v3-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Strict TypeScript check
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters

      - name: Test with coverage
        run: npm test -- --runInBand --coverage

      - name: Build library
        run: npm run build

      - name: Build documentation
        run: npm run docs:build

      - name: Verify declaration exports
        run: npm run verify:declarations

      - name: Full dependency audit
        run: npm audit --audit-level=high

      - name: Production dependency audit
        run: npm audit --omit=dev

      - name: Check diff whitespace
        run: git diff --check

  browser:
    name: Browser smoke tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, edge]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser and OS dependencies
        run: npx playwright install --with-deps ${{ matrix.browser == 'edge' && 'msedge' || matrix.browser }}

      - name: Restore browser performance history
        uses: actions/cache/restore@v4
        with:
          path: benchmark-results/browser-history
          key: onekit-browser-history-${{ github.ref_name }}-${{ matrix.browser }}-${{ github.run_id }}
          restore-keys: |
            onekit-browser-history-${{ github.ref_name }}-${{ matrix.browser }}-
      - name: Run real-browser smoke tests and enforce performance budgets
        run: npm run test:browser -- --project=${{ matrix.browser }}
      - name: Record browser performance history
        if: always()
        continue-on-error: true
        run: node scripts/record-browser-history.mjs --browser ${{ matrix.browser }}
      - name: Save browser performance history
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: benchmark-results/browser-history
          key: onekit-browser-history-${{ github.ref_name }}-${{ matrix.browser }}-${{ github.run_id }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onekit-v3-playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
            benchmark-results/browser-history/
            scripts/browser-performance-budgets.json
          if-no-files-found: ignore

  package:
    name: Verify packed package
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify clean package installation
        run: npm run verify:package

      - name: Verify declaration exports from the package checkout
        run: npm run verify:declarations

      - name: Verify Vite HMR lifecycle
        run: npm run verify:hmr

      - name: Inspect package contents
        run: npm pack --dry-run

  benchmark:
    name: Run V3 benchmark
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmark suite
        run: ONEKIT_BENCH_ITERATIONS=10000 ONEKIT_BENCH_SAMPLES=5 npm run benchmark

      - name: Run forced-GC memory benchmark
        run: ONEKIT_MEMORY_OBJECTS=10000 npm run benchmark:memory

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: onekit-v3-benchmark
          path: |
            benchmark-results/v3.json
            benchmark-results/memory-v3.json
          if-no-files-found: error

  release-artifact:
    name: Build release artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Pack release tarball
        run: npm pack --pack-destination ./release

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: onekit-v3-release
          path: release/*.tgz
          if-no-files-found: error
