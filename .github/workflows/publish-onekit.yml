name: Publish onekit-js

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-onekit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish onekit-js
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate package version and metadata
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_NAME" == v*.*.* ]]; then
            TAG_VERSION="${TAG_NAME#v}"
            if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
              echo "Package version $PACKAGE_VERSION does not match tag $TAG_NAME" >&2
              exit 1
            fi
          fi
          node -e "const p=require('./package.json'); if (p.name !== 'onekit-js') process.exit(1); if (p.publishConfig?.access !== 'public') process.exit(1); if (!p.bin?.onekit) process.exit(1)"

      - name: Run release validation
        run: npm run prepublishOnly

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm with provenance
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --provenance

      - name: Explain manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo 'Manual dispatch validates the package only.'
          echo 'Create and push a matching v<version> tag to publish.'

      - name: Verify published version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${PACKAGE_VERSION#v}"
          for attempt in 1 2 3 4 5; do
            if [[ "$(npm view onekit-js@"$VERSION" version 2>/dev/null || true)" == "$VERSION" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "Published version $VERSION was not visible in the npm registry." >&2
          exit 1
